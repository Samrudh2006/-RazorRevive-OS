version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: razorrevive-os
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MUTEX_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - audit_data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: razorrevive-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  audit_data:
  redis_data:
