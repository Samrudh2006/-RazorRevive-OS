name: RazorRevive-OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Test Suite & Security Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv Package Manager
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install Dependencies
        run: |
          ~/.local/bin/uv venv
          ~/.local/bin/uv pip install -r requirements.txt

      - name: Run Test Suite (47/47 Tests & Adversarial Verification)
        run: |
          ~/.local/bin/uv run pytest -v --cov=backend --cov-report=term-missing

      - name: Run 100-Batch Production Benchmark
        run: |
          ~/.local/bin/uv run python benchmarks/benchmark_runner.py

      - name: Verify Cryptographic Audit Chain CLI
        run: |
          ~/.local/bin/uv run python cli.py verify-audit

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: test-and-validate
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: razorrevive-os:latest
