name: RazorRevive-OS Production Readiness CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    name: 10-Layer Production Readiness Verification

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings httpx pytest

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run 10-Layer Production Readiness Matrix (44 Assertions)
        run: |
          python tests/production_readiness_matrix.py
