name: 24/7 Render Keep-Alive Pinger

on:
  schedule:
    # Ping every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RazorRevive-OS on Render
        run: |
          echo "Pinging Render health endpoint to keep service warm..."
          curl -s -f https://razorrevive-os.onrender.com/health || echo "Render ping sent"
